group = dev.lobotagram
version = 0.1.0

org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true

# The patches jar is loaded by ReVanced CLI / Manager, which already provide the
# Kotlin standard library. Bundling it again would bloat the rvp and its DEX.
kotlin.stdlib.default.dependency = false
